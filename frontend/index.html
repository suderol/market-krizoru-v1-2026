<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Krizörü v1 - 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🏪</span>
        <div>
          <h1 class="text-xl font-bold text-emerald-400 tracking-wide">MARKET KRİZÖRÜ</h1>
          <p class="text-xs text-slate-400">Kriz Yönetimi Geliştirme Simülasyonu</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50 text-center min-w-[100px]">
          <p class="text-xs text-slate-400 font-semibold">SİMÜLASYON GÜNÜ</p>
          <p id="game-day" class="text-xl font-bold text-amber-400">1</p>
        </div>
        <div class="bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50 text-center min-w-[140px]">
          <p class="text-xs text-slate-400 font-semibold">KASA BAKİYESİ</p>
          <p id="cash-balance" class="text-xl font-bold text-emerald-400">10,000.00 TL</p>
        </div>
        <div class="bg-slate-900/50 px-4 py-2 rounded-xl border border-slate-700/50 text-center min-w-[130px]">
          <p class="text-xs text-slate-400 font-semibold">CANLI DOLAR KURU</p>
          <p id="usd-rate" class="text-xl font-bold text-blue-400">32.00 TL</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-8">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-200 flex items-center gap-2">
          <span>📦</span> Ürün Yönetim Paneli
        </h2>
        <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">Fiyatlar dinamik güncellenir</span>
      </div>

      <div id="inventory-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <p class="text-slate-400 animate-pulse">Raflar yükleniyor...</p>
      </div>
    </div>

    <div class="space-y-6">
      <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
        <span>📢</span> Canlı Kriz Günlüğü
      </h2>
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg min-h-[400px] flex flex-col">
        <div id="logs-container" class="space-y-3 flex-1 overflow-y-auto pr-1 max-h-[450px]">
          <p class="text-xs text-slate-500 text-center py-8">Ekonomik gelişmeler bekleniyor...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
